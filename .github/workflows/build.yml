name: Build LayananIndogaro APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Compile Golang Binary (ARM64 Android)
        run: |
          mkdir -p app/src/main/assets
          if [ -f "main.go" ] || [ -f "go.mod" ]; then
            echo "[*] Mengompilasi Golang binary..."
            CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags="-s -w" -o app/src/main/assets/indogaro .
          fi

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK via Gradle
        run: |
          if [ ! -f "gradlew" ]; then
            echo "[*] Mengunci Gradle ke versi 8.7 (Syarat Mutlak AGP 8.2.2)..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LayananIndogaro-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
